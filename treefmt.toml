# One CLI to format the code tree - https://git.numtide.com/numtide/treefmt

# Global excludes to avoid walking into large/third-party directories
# This significantly speeds up the initial file discovery phase.
excludes = [
  "Manifest.toml",
  ".git/**",
]

[formatter.nixfmt]
command = "nixfmt"
includes = ["**/*.nix"]

[formatter.fish-fmt]
command = "fish_indent"
options = ["-w"]
includes = ["**/*.fish"]

[formatter.jsonfmt]
command = "jsonfmt"
includes = ["**/*.json"]
# Exclude DMS shell settings to prevent formatting conflicts with
# the application's native, auto-managed configuration updates.
# Exclude vimium backup - requires escaped \n for import.
excludes = ["DankMaterialShell/settings.json", "vimium/vimium.json"]
options = ["-w"]

[formatter.yamlfmt]
command = "yamlfmt"
includes = ["**/*.yaml", "**/*.yml"]

[formatter.taplo]
command = "taplo"
options = ["format"]
includes = ["**/*.toml"]
excludes = ["Manifest.toml"]

[formatter.gofmt]
command = "gofmt"
options = ["-w"]
includes = ["**/*.go"]

[formatter.stylua]
command = "stylua"
includes = ["**/*.lua"]

[formatter.sort-editors-json-settings]
command = "jaq"
options = ["--in-place", "--sort-keys", "."]
includes = ["zed/settings.json", "vscode/settings.json"]
