# ssh.conf — kitty ssh kitten (kitty 0.50)
# Docs: https://sw.kovidgoyal.net/kitty/kittens/ssh/#config-file-ssh-conf

# Re-use existing connections to skip SSH setup latency
share_connections yes

# New in 0.50: per-host color schemes that follow the OS dark/light mode and
# switch live when the OS switches. Takes themes-kitten theme names, same
# syntax as color_scheme. Requires running the ssh kitten inside kitty and
# outside multiplexers like tmux; otherwise only color_scheme is used.
# color_scheme_dark Dracula
# color_scheme_light <a light theme name>
# color_scheme_no_preference Dracula
