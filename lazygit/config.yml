# Diff renderer configuration
# https://github.com/jesseduffield/lazygit/blob/master/docs/Custom_DiffRenderers.md
git:
  # lazygit 0.66 dropped delta auto-detection from git config: without an
  # explicit entry here the main view renders raw git diffs. With delta 0.20
  # (OSC-1717 metadata) side-by-side / line numbers / decorations from
  # git/config now work AND hunk staging still functions.
  diffRenderers:
    # Side-by-side delta; clickable line numbers jump into the editor.
    # Below 110 cols the default feature list is replaced without it (delta
    # booleans can only be turned ON by config — that's why side-by-side is a
    # named feature in git/config, excludable per invocation).
    - name: delta
      command: >-
        delta {{if lt .width 110}}--features='unobtrusive-line-numbers decorations'{{end}} --{{colorScheme}} --paging=never --hyperlinks --hyperlinks-file-link-format=lazygit-edit://{path}:{line}
    # Plain git diff, cycle to it with '|'
    - type: rawGit
      name: raw
      # TODO: add a difftastic (extDiff) renderer once upstream supports the
      # OSC-1717 line-metadata protocol (Wilfred/difftastic#1014); until then
      # lazygit can't stage/discard individual lines in difft-rendered diffs.
gui:
  # No theme block on purpose: lazygit's v0.66 defaults are ANSI color names
  # (green/cyan/blue/red) that render through the terminal's own palette —
  # Dracula here — plus background-computed colors, and they adapt to dark/light
  # (colorScheme: auto). Hardcoded hex would bypass the palette and freeze dark.
  # https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md#color-attributes
  # Staging-panel selection carried over to the main view in v0.66 under this
  # name (migrated from useHunkModeInStagingView); false = line selection.
  useHunkModeInDiffView: false
  nerdFontsVersion: "3"
