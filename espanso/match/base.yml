# espanso match file — dev starter set
# Docs: https://espanso.org/docs/
matches:
  - trigger: ";id"
    replace: "{{id}}"
    vars:
      - name: id
        type: date
        params:
          format: "%y%m%d%H%M%S"
  - trigger: ";date"
    replace: "{{date}}"
    vars:
      - name: date
        type: date
        params:
          format: "%d/%m/%Y"
  - trigger: ";now"
    replace: "{{now}}"
    vars:
      - name: now
        type: date
        params:
          format: "%H:%M"
  - trigger: ";timestamp"
    replace: "{{timestamp}}"
    vars:
      - name: timestamp
        type: date
        params:
          format: "%Y-%m-%d %H:%M:%S"
  - trigger: ";uuid"
    replace: "{{uuid}}"
    vars:
      - name: uuid
        type: script
        params:
          args:
            - /bin/sh
            - -c
            - 'if [ -r /proc/sys/kernel/random/uuid ]; then cat /proc/sys/kernel/random/uuid; else uuidgen; fi'
  - trigger: ";ip"
    replace: "{{output}}"
    vars:
      - name: output
        type: script
        params:
          args:
            - /bin/sh
            - -c
            - 'if [ -x /run/current-system/sw/bin/curl ]; then CURL=/run/current-system/sw/bin/curl; elif [ -x /usr/bin/curl ]; then CURL=/usr/bin/curl; else CURL=curl; fi; exec "$CURL" -s https://api.ipify.org'
