# espanso configuration file
# Docs: https://espanso.org/docs/
# Minimal config for niri (Wayland, EVDEV backend).
# Auto-restart: pick up config/match changes without a manual restart.
auto_restart: true
# Keyboard layout used by the EVDEV detection/injection backends.
# Required on Wayland; must match the layout configured in niri.
keyboard_layout:
  rules: evdev
  layout: us
  model: pc105
  variant: altgr-intl

# Double-tap to toggle espanso on/off (CTRL, SHIFT, ALT, CMD, or OFF).
# toggle_key: ALT
